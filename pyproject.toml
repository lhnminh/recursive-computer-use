[project]
name = "recursive-computer-use"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Minh Le", email = "lehnminh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=1.80.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.6.0",
    "playwright>=1.63.0",
    "pyobjc-framework-applicationservices>=12.2.2 ; sys_platform == 'darwin'",
]

[project.scripts]
recursive-computer-use = "recursive_computer_use:main"
recursive-computer-use-chat = "recursive_computer_use.webui:launch"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
